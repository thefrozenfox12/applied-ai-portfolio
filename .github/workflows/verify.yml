name: Verify saved analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: signal-review-analysis
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test boundary cases
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Verify every saved request, prediction and statistic
        run: python verify_results.py
      - name: Rebuild the dashboard and report without API access
        run: |
          python dashboard.py
          python report.py
      - name: Check that published artifacts reproduce
        run: git diff --exit-code -- dashboard.html README.md results/analysis.json
